name: Portfolio quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check js/main.js
      - name: Generated gallery
        run: node scripts/render-gallery.mjs --check
      - name: Static site check
        run: node scripts/check.mjs
